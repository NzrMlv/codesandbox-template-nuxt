# Fallback only: the checked-in FocusNext.xcodeproj is the source of truth.
# If it ever fails to open, run `xcodegen` in this folder to regenerate it.
name: FocusNext
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  FocusNext:
    type: application
    platform: iOS
    sources: [FocusNext]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.FocusNext
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Focus Next
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Focus Next reads your calendar to show your current and next events.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Focus Next reads your reminders to show today's tasks and lets you tick them off.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
